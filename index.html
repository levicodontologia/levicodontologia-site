<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="LEVIC Odontologia — um novo espaço para cuidar do seu sorriso está chegando.">
<title>LEVIC Odontologia | Em breve</title>
<style>
:root{
  --green:#183c38;
  --gold:#b2794c;
  --beige:#ab9a8c;
  --background:#f8f7f4;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:var(--background);
}
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--green);
  font-family:Arial,Helvetica,sans-serif;
  text-align:center;
}
main{
  width:min(760px,92vw);
  padding:48px 24px 56px;
}
.logo{
  width:min(630px,82vw);
  height:auto;
  display:block;
  margin:0 auto 42px;
}
.line{
  width:52px;
  height:2px;
  background:var(--gold);
  margin:0 auto 28px;
}
h1{
  margin:0 0 14px;
  font-size:clamp(28px,5vw,44px);
  font-weight:400;
  line-height:1.2;
}
p{
  margin:0 auto;
  max-width:600px;
  color:#6e6a64;
  font-size:clamp(16px,2.2vw,19px);
  line-height:1.7;
}
.location{
  margin-top:34px;
  color:var(--beige);
  font-size:14px;
  letter-spacing:.16em;
  text-transform:uppercase;
}
footer{
  margin-top:48px;
  color:#999187;
  font-size:12px;
}
</style>
</head>
<body>
<main>
<img class="logo" src="logo-levic.png" alt="LEVIC Odontologia">
<div class="line"></div>
<h1>Em breve, um novo espaço para cuidar do seu sorriso.</h1>
<p>Estamos preparando uma nova experiência em odontologia, com cuidado, tecnologia e acolhimento.</p>
<div class="location">Campolim · Sorocaba · SP</div>
<footer>LEVIC Odontologia</footer>
</main>
</body>
</html>
